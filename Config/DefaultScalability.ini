; Chronoshift overrides on top of Engine/Config/BaseScalability.ini (only the keys listed here change).

; Volcano eruption plume (heterogeneous volumes): render at full resolution on High/Epic so the
; smoke keeps crisp billows instead of a blurry half-res smudge. Low/Medium keep volumes disabled.
[EffectsQuality@2]
r.HeterogeneousVolumes.DownsampleFactor=1

[EffectsQuality@3]
r.HeterogeneousVolumes.DownsampleFactor=1
r.HeterogeneousVolumes.MaxStepCount=384

[EffectsQuality@Cine]
r.HeterogeneousVolumes.DownsampleFactor=1
